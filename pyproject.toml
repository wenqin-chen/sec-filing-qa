[project]
name = "secqa"
version = "0.1.0"
description = "Grounded question answering over SEC 10-K/10-Q filings: hybrid RAG with verified page-level citations, a tool-using agent over XBRL facts, and a reproducible FinanceBench evaluation harness."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Wenqin Chen" }]
requires-python = ">=3.11,<3.13"
keywords = ["rag", "llm", "sec", "edgar", "financebench", "evaluation", "fastapi", "duckdb"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "duckdb>=1.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "pypdfium2>=4.30",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "tenacity>=8.3",
  "python-multipart>=0.0.9",
  "orjson>=3.10",
  # Needed by later modules (kept in the base install so parallel module agents never add deps).
  "structlog>=24.1",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "tiktoken>=0.7",
  "sqlglot>=25.0",
  "slowapi>=0.1.9",
  "zstandard>=0.22",
  "pandas>=2.2",
  "datasets>=2.20",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0"]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
api-embeddings = ["openai>=1.40"]
gcs = ["google-cloud-storage>=2.17"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "reportlab>=4.2",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]

[project.scripts]
secqa = "secqa.cli:app"

[project.urls]
Homepage = "https://github.com/wenqinchen/sec-filing-qa"
Issues = "https://github.com/wenqinchen/sec-filing-qa/issues"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secqa"]

[tool.hatch.build.targets.sdist]
include = ["src/secqa", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not live and not slow" -ra --strict-markers'
markers = [
  "live: hits a real vendor API or the public internet; needs keys, skipped by default",
  "slow: downloads model weights or runs for minutes; opt-in",
]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:secqa.*"]

[tool.coverage.run]
source = ["secqa"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["data", "results", "cassettes", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # typer/fastapi use call defaults on purpose

[tool.ruff.lint.isort]
known-first-party = ["secqa"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
ignore_missing_imports = true
files = ["src/secqa"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
