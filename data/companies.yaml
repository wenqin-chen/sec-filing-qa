# FinanceBench company -> ticker -> SEC CIK (SPEC 4.1: "the one manual data task").
#
# Used by `secqa ingest financebench` to attach ticker/CIK to each PDF (so the ticker filter and
# lookup_fact work) and by `secqa data companies-xbrl` to pull companyfacts for every company.
#
# `financebench_aliases` are the company prefixes of FinanceBench doc_name values
# ('JOHNSON_JOHNSON' in 'JOHNSON_JOHNSON_2022_10K'); matching is case- and punctuation-
# insensitive and also accepts the ticker and the display name.
#
# CIKs verified against https://www.sec.gov/files/company_tickers.json and
# https://data.sec.gov/submissions/CIK##########.json on 2026-09-11. Three companies no longer
# trade under the ticker FinanceBench knew them by; their CIKs still serve companyfacts:
#   - Activision Blizzard (ATVI) was acquired by Microsoft in October 2023 (delisted).
#   - Block traded as SQ until January 2025; EDGAR now lists it as XYZ.
#   - Foot Locker (FL) was acquired by Dick's Sporting Goods in 2025 (Form 15 filed).
companies:
  - name: 3M Company
    ticker: MMM
    cik: "0000066740"
    financebench_aliases: ["3M"]
