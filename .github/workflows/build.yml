# Build and publish both image targets to GHCR on main and on version tags (SPEC section 10).
#   ghcr.io/<owner>/sec-filing-qa:<sha>, :latest, :vX.Y.Z          (target full)
#   ghcr.io/<owner>/sec-filing-qa:<sha>-slim, :latest-slim, :vX.Y.Z-slim  (target slim)
# The deploy workflows reference the full image by commit SHA so a deployment is reproducible.
# A package first pushed with GITHUB_TOKEN is private; Container Apps pulls it anonymously, so the
# package is switched to public once by hand after the first run (infra/azure/README.md, step 5).
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/sec-filing-qa

jobs:
  publish:
    name: build + push (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [full, slim]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
            suffix=${{ matrix.target == 'slim' && '-slim' || '' }},onlatest=true
          tags: |
            type=sha,format=long,prefix=
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=sec-filing-qa
            org.opencontainers.image.description=Grounded QA over SEC filings (${{ matrix.target }} image)
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: false

      - name: Published tags
        run: |
          {
            echo "## Published (${{ matrix.target }})"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
