# Deploy the full image to Azure Container Apps via Bicep (SPEC section 10).
#
# Guarded by the repository variable DEPLOY_AZURE == 'true'. Auth is an OIDC federated credential
# on an app registration (no client secret). The Bicep template (infra/azure/main.bicep) creates
# or updates the Log Analytics workspace, the Container Apps environment and the app
# (min 0 / max 2 replicas, 1 vCPU / 2 GiB, external ingress on 8080). Vendor keys are passed as
# secure Bicep parameters straight from GitHub secrets and stored as Container Apps secrets.
#
# build.yml fires on the same tag push and needs many minutes for the `full` target, so the job
# first waits (bounded) for ghcr.io/<owner>/sec-filing-qa:<sha> to exist; otherwise the new
# revision would fail to provision with an image-pull error.
#
# Repository variables:
#   DEPLOY_AZURE=true
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID   (federated credential identity)
#   AZURE_RESOURCE_GROUP            existing resource group (created by hand on Day 1)
#   AZURE_LOCATION                  default eastus
#   AZURE_APP_NAME                  default sec-filing-qa
#   SECQA_INDEX_URL, SECQA_EMBEDDER (default local), SECQA_PROVIDER (default mock)
# Repository secrets (all optional; empty = not configured on the app):
#   OPENAI_API_KEY, ANTHROPIC_API_KEY, SECQA_API_KEY
name: deploy-azure

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (commit SHA or vX.Y.Z); default: this commit"
        required: false
        default: ""

permissions:
  contents: read
  packages: read
  id-token: write

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  deploy:
    name: az deployment group create (Container Apps)
    if: vars.DEPLOY_AZURE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: azure
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      LOCATION: ${{ vars.AZURE_LOCATION || 'eastus' }}
      APP_NAME: ${{ vars.AZURE_APP_NAME || 'sec-filing-qa' }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/sec-filing-qa:${{ inputs.image_tag || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR (image existence check)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for build.yml to publish the image
        env:
          IMAGE_WAIT_MINUTES: "45"
        run: |
          set -euo pipefail
          # build.yml runs on the same `v*` tag push and only publishes ghcr.io/<owner>/sec-filing-qa:<sha>
          # once the slow `full` target (torch) has been built, so this job must not race it. Poll the
          # registry with a hard deadline and fail with a clear message if the tag never appears.
          DEADLINE=$(( $(date +%s) + 60 * IMAGE_WAIT_MINUTES ))
          until docker manifest inspect "${IMAGE}" >/dev/null 2>&1; do
            if [ "$(date +%s)" -ge "${DEADLINE}" ]; then
              echo "::error::${IMAGE} was not published within ${IMAGE_WAIT_MINUTES} min. build.yml must publish this tag first: check the build run for commit ${GITHUB_SHA}, or dispatch this workflow with an image_tag that already exists on GHCR."
              exit 1
            fi
            echo "$(date -u +%H:%M:%S) ${IMAGE} not published yet; retrying in 30 s"
            sleep 30
          done
          echo "found ${IMAGE}"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep (create or update the container app)
        id: deploy
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            set -euo pipefail
            az deployment group create \
              --resource-group "${RESOURCE_GROUP}" \
              --name "secqa-${GITHUB_RUN_ID}" \
              --template-file infra/azure/main.bicep \
              --parameters \
                name="${APP_NAME}" \
                location="${LOCATION}" \
                image="${IMAGE}" \
                gitSha="${GITHUB_SHA}" \
                indexUrl="${{ vars.SECQA_INDEX_URL }}" \
                embedder="${{ vars.SECQA_EMBEDDER || 'local' }}" \
                provider="${{ vars.SECQA_PROVIDER || 'mock' }}" \
                openaiApiKey="${{ secrets.OPENAI_API_KEY }}" \
                anthropicApiKey="${{ secrets.ANTHROPIC_API_KEY }}" \
                secqaApiKey="${{ secrets.SECQA_API_KEY }}" \
              --query 'properties.outputs' -o json > deploy-outputs.json
            FQDN=$(python3 -c 'import json; print(json.load(open("deploy-outputs.json"))["fqdn"]["value"])')
            echo "url=https://${FQDN}" >> "$GITHUB_OUTPUT"

      - name: Smoke /readyz and /v1/ask (provider=mock)
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            if curl -fsS "${URL}/readyz" >/dev/null 2>&1; then break; fi
            sleep 5
          done
          READY=$(curl -fsS "${URL}/readyz")
          ASK=$(curl -fsS -X POST "${URL}/v1/ask" \
            -H 'Content-Type: application/json' \
            -d '{"question": "What were total net sales in fiscal 2023?", "provider": "mock", "mode": "rag", "k": 4}')
          {
            echo "## Azure Container Apps smoke: ${URL}"
            echo "Image: \`${IMAGE}\`"
            echo
            echo '```json'
            echo "${READY}"
            echo "${ASK}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "${ASK}" | python3 -c 'import json,sys; a=json.load(sys.stdin); assert a["citations"], "no citations in the mock answer"; print("citations:", len(a["citations"]), "verified:", sum(c["verified"] for c in a["citations"]))'
