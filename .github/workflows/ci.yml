# CI (SPEC section 10): lint + offline tests + mock smoke eval on every PR/push, gitleaks, and a
# container build (no push) whose running instance must answer /healthz, /readyz and a mock
# /v1/ask. Nothing here needs a vendor key or the network beyond package downloads.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: ruff + pytest (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install project (dev + vendor SDK extras, no local embedder)
        run: uv sync --extra dev --extra openai --extra anthropic

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

      - name: Mypy (non-blocking)
        run: uv run --no-sync mypy || true

      - name: Offline tests with coverage
        run: uv run --no-sync pytest -q --cov=secqa --cov-report=xml --cov-report=term

      - name: Mock smoke evaluation
        run: uv run --no-sync secqa eval --config configs/rag_mock.yaml --limit 6

      - name: Upload coverage and smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-outputs
          path: |
            coverage.xml
            results/**/summary.json
          if-no-files-found: ignore

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_SUMMARY: "true"

  docker:
    name: docker build + container smoke (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (target slim, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: slim
          push: false
          load: true
          tags: sec-filing-qa:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the container (zero config -> fixture index, provider=mock)
        run: docker run -d --rm -p 8080:8080 --name secqa sec-filing-qa:ci

      - name: Smoke /healthz, /readyz and /v1/ask
        run: |
          set -euo pipefail
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8080/readyz >/dev/null 2>&1; then break; fi
            sleep 2
          done
          echo "## Container smoke (target slim)" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          curl -fsS http://localhost:8080/healthz | tee -a "$GITHUB_STEP_SUMMARY"; echo >> "$GITHUB_STEP_SUMMARY"
          curl -fsS http://localhost:8080/readyz | tee -a "$GITHUB_STEP_SUMMARY"; echo >> "$GITHUB_STEP_SUMMARY"
          curl -fsS -X POST http://localhost:8080/v1/ask \
            -H 'Content-Type: application/json' \
            -d '{"question": "What were total net sales in fiscal 2023?", "provider": "mock", "mode": "rag", "k": 4}' \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Container logs
        if: always()
        run: docker logs secqa || true

      - name: Stop the container
        if: always()
        run: docker stop secqa || true
