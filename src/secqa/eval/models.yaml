# Token prices used to compute cost_usd per question (USD per 1M tokens).
#
# Read by secqa.providers.pricing.PriceTable.load(). Shape: models.<provider>.<model> with
# input / cached_input / output, optional cache_write (defaults to input). Deterministic providers
# (mock, scripted) are always free; any other unpriced (provider, model) makes a run fail loudly
# instead of reporting $0.
#
# as_of is recorded in every EvalRecord / RunSummary (models_yaml_as_of) so a published number is
# tied to the price list it was computed with. Rates below are the SPEC 4.1 values; `secqa doctor`
# is expected to re-check each configured model id against the vendor models endpoint before the
# first paid run. Anthropic bills prompt-cache writes above the input rate; the multiplier is
# deliberately NOT guessed here (cache_write defaults to input) - set it once verified.
as_of: 2026-09-11
models:
  anthropic:
    claude-opus-5: {input: 5.00, cached_input: 0.50, output: 25.00}
    claude-sonnet-5: {input: 2.00, cached_input: 0.20, output: 10.00}
  openai:
    gpt-5.5: {input: 5.00, cached_input: 0.50, output: 30.00}
    gpt-5.4-mini: {input: 0.75, cached_input: 0.075, output: 4.50}
    text-embedding-3-small: {input: 0.02}
